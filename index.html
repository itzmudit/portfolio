<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudit Jindal · back soon</title>
<meta name="robots" content="noindex">
<meta name="description" content="Mudit Jindal's site is being updated. Back soon.">
<meta name="theme-color" content="#07090a">
<meta property="og:title" content="Mudit Jindal · back soon">
<meta property="og:description" content="The site is being updated. Back soon.">
<meta property="og:image" content="https://muditjindal.vercel.app/og.jpg">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090a;--ink:#ece6d8;--muted:#8a949a;--accent:#ffb547;--g:#62c784;--line:#1f2a2c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font:400 15px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    min-height:100vh;display:grid;place-items:center;padding:24px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:48px 48px;background-position:-1px -1px}
  body::before{content:"";position:fixed;inset:0;background:radial-gradient(55% 45% at 50% 45%,rgba(255,181,71,.07),var(--bg) 78%);pointer-events:none}
  main{position:relative;width:min(560px,100%);text-align:center}
  .mj{display:inline-grid;place-items:center;width:64px;height:64px;border:3px solid var(--accent);border-radius:16px;
    font:900 30px/1 "Big Shoulders Display","Arial Narrow",sans-serif;color:var(--accent);box-shadow:0 0 28px rgba(255,181,71,.25)}
  h1{font:900 clamp(56px,15vw,96px)/.9 "Big Shoulders Display","Arial Narrow",sans-serif;margin:22px 0 10px;letter-spacing:-1px;text-transform:uppercase}
  h1 b{color:var(--accent)}
  .cmd{display:inline-block;margin:6px 0 4px;padding:10px 14px;border:1px solid #2a3437;border-radius:10px;background:#0b0e0f;text-align:left}
  .p{color:var(--g)}
  .bar{display:block;height:3px;margin-top:10px;border-radius:2px;background:#1d2527;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.6s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  p.note{color:var(--muted);margin:18px 0}
  nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  nav a{color:var(--ink);text-decoration:none;border:1px solid #2a3437;border-radius:8px;padding:8px 12px;font-size:13px}
  nav a:hover,nav a:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:60%}}
</style>
</head>
<body>
<main>
  <span class="mj" aria-hidden="true">MJ</span>
  <h1>Back <b>soon</b></h1>
  <div class="cmd"><span class="p">mudit@lab:~$</span> sudo systemctl restart portfolio<span class="bar"><i></i></span></div>
  <p class="note">The site is getting an upgrade. It'll be back shortly.<br>Meanwhile, you can still find me here:</p>
  <nav>
    <a href="mailto:muditjindal100@gmail.com">muditjindal100@gmail.com</a>
    <a href="https://github.com/itzmudit" rel="noopener">github</a>
    <a href="https://www.linkedin.com/in/itzmudit" rel="noopener">linkedin</a>
    <a href="https://caughtbot.streamlit.app" rel="noopener">try CaughtBot</a>
  </nav>
</main>
</body>
</html>
